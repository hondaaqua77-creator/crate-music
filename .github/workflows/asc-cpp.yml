# Custom Product Pages (カスタムプロダクトページ) — Actions → ASC custom product pages → Run workflow.
name: ASC custom product pages
on:
  workflow_dispatch:
    inputs:
      step:
        description: 'create = ページ作成・スクショ登録 / submit = 審査提出'
        default: create
        type: choice
        options: [create, submit]
jobs:
  cpp:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Run
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 app/scripts/asc-cpp.py ${{ inputs.step }}
