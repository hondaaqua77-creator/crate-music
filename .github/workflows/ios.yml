# CRATE iOS build on GitHub's cloud Mac.
#  - "build": every push to main that touches the app → builds for the iOS Simulator (no Apple account needed).
#  - "testflight": run by hand (Actions → iOS → Run workflow) once the Apple secrets are registered;
#    signs the app with your Apple Developer account and uploads it to App Store Connect / TestFlight.
name: iOS
on:
  push:
    branches: [main]
    paths: ['index.html', 'vendor/**', 'icons/**', 'app/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      upload:
        description: 'TestFlight にアップロードする'
        type: boolean
        default: true

defaults:
  run:
    shell: bash   # bash -eo pipefail: a failed xcodebuild fails the job even when piped to tail

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Use the newest Xcode (App Store requires the iOS 26 SDK or later)
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Xcode 26 以降が見つかりません"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Copy web app and sync Capacitor
        working-directory: app
        env:
          CRATE_BUILD: ${{ github.run_number }}
        run: |
          npm ci
          npm run sync
      - name: Build for iOS Simulator (unsigned)
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test -d ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Debug-iphonesimulator/App.app && echo 'App.app built OK'

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    needs: build
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '9YK6TS56W7' }}
      # AdMob IDs are public (they ship inside the app); Secrets can override them
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || 'ca-app-pub-6323228654710695~1395552037' }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID || 'ca-app-pub-6323228654710695/8096516749' }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID || 'ca-app-pub-6323228654710695/3811075776' }}
    steps:
      - name: Check Apple secrets
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::GitHub の Secrets に $v が登録されていません（手順書を参照）"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Use the newest Xcode (App Store requires the iOS 26 SDK or later)
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Xcode 26 以降が見つかりません"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Copy web app and sync Capacitor
        working-directory: app
        env:
          CRATE_BUILD: ${{ github.run_number }}
        run: |
          npm ci
          npm run sync
      - name: Use production AdMob app ID (if registered)
        run: |
          if [ -n "$ADMOB_APP_ID" ]; then
            /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $ADMOB_APP_ID" app/ios/App/App/Info.plist
            echo "production AdMob app ID set"
          else
            echo "::warning::ADMOB_APP_ID が未登録のため、テスト広告のままビルドします"
          fi
      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Create distribution certificate and profile (App Store Connect API)
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet pyjwt cryptography
          python3 app/scripts/ci-signing.py setup
      - name: Archive (signed for App Store distribution)
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CRATE.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tail -40
      - name: Upload to App Store Connect (TestFlight)
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CRATE.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
      - name: Remove the temporary certificate and profile
        if: always()
        run: python3 app/scripts/ci-signing.py cleanup || true
