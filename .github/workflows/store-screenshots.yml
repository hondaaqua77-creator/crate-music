# Uploads app/store/screenshots to App Store Connect (run by hand: Actions → Store screenshots → Run workflow).
name: Store screenshots
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'store = App Store screenshots / iap = 広告なし版の審査用スクリーンショット'
        default: store
        type: choice
        options: [store, iap]
jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Upload screenshots
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          if [ "${{ inputs.target }}" = "iap" ]; then
            python3 app/scripts/asc-iap-screenshot.py
          else
            python3 app/scripts/asc-screenshots.py
          fi
